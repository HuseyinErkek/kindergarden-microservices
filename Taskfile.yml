version: '3.8'

vars:
  MODULE: catalog-service
  INFRA_FILE: deployment/docker-compose/infra.yml
  APPS_FILE: deployment/docker-compose/apps.yml
  PROJECT_VERSION:
    sh: mvn help:evaluate -Dexpression=project.version -q -DforceStdout

tasks:

  # ==========================================================
  # DEFAULT
  # ==========================================================
  default:
    desc: "Format + Test + Docker Image build"
    cmds:
      - task: build

  # ==========================================================
  # CODE QUALITY
  # ==========================================================
  format:
    desc: "Spotless ile kod formatlar"
    cmds:
      - mvn -pl {{.MODULE}} spotless:apply

  check-format:
    desc: "CI için format kontrolü"
    cmds:
      - mvn -pl {{.MODULE}} spotless:check

  # ==========================================================
  # BUILD
  # ==========================================================
  test:
    desc: "Tüm testleri çalıştırır"
    cmds:
      - mvn -pl {{.MODULE}} clean verify

  build:
    desc: "Format → Test → Docker image üretir"
    deps: [format]
    cmds:
      - mvn -pl {{.MODULE}} clean verify
      - mvn -pl {{.MODULE}} spring-boot:build-image -DskipTests

  # ==========================================================
  # RUN (LOCAL)
  # ==========================================================
  run:
    desc: "Infra + Spring Boot (Lokal Çalışma)"
    deps: [infra-up]
    cmds:
      - mvn -pl {{.MODULE}} spring-boot:run

  # ==========================================================
  # DOCKER COMPOSE - INFRA
  # ==========================================================
  infra-up:
    desc: "Postgres, Redis vs. ayağa kaldırır"
    cmds:
      - docker-compose -f {{.INFRA_FILE}} up -d
      - echo "⏳ Altyapı başlatıldı, veritabanının hazır olması bekleniyor..."
      # Veritabanının 'healthy' olmasını bekleyen basit bir sleep (daha güvenli)
      - task: sleep

  infra-down:
    desc: "Altyapıyı kapatır ve volume'leri temizler"
    cmds:
      - docker-compose -f {{.INFRA_FILE}} down -v

  infra-restart:
    desc: "Temiz altyapı restart"
    cmds:
      - task: infra-down
      - task: sleep
      - task: infra-up

  infra-logs:
    desc: "Altyapı logları"
    cmds:
      - docker-compose -f {{.INFRA_FILE}} logs -f

  # ==========================================================
  # FULL SYSTEM (APP + INFRA)
  # ==========================================================
  start:
    desc: "Sırasıyla Infra ve App container başlatır"
    deps: [build]
    cmds:
      # 1. Önce altyapıyı başlat (Ağ burada oluşur)
      - task: infra-up

      # 2. Sonra uygulamayı başlat (Artık ağı bulabilir)
      - echo "🚀 Uygulama başlatılıyor..."
      - APP_VERSION={{.PROJECT_VERSION}} docker-compose -f {{.APPS_FILE}} up -d
  stop:
    desc: "Tüm sistemi durdurur"
    cmds:
      - docker-compose -f {{.APPS_FILE}} down --remove-orphans
      - docker-compose -f {{.INFRA_FILE}} down --remove-orphans

  restart:
    desc: "Tüm sistemi temizleyip yeniden başlatır"
    cmds:
      - task: stop
      - task: start

  logs:
    desc: "Uygulama + DB logları"
    cmds:
      # İki dosyanın loglarını birleştirerek gösterir
      - docker-compose -f {{.INFRA_FILE}} -f {{.APPS_FILE}} logs -f

  # ==========================================================
  # UTIL
  # ==========================================================
  sleep:
    internal: true
    vars:
      DURATION: '{{default 5 .DURATION}}'
    cmds:
      - echo "⏳ {{.DURATION}} saniye bekleniyor..."
      - sleep {{.DURATION}}