version: '3'

vars:
  # Modül adı ve altyapı dosya yolu değişkenleri
  MODULE: catalog-service
  INFRA_FILE: deployment/docker-compose/infra.yml

tasks:
  default:
    desc: "Varsayılan görev: Önce formatlar, sonra test edip derler"
    cmds:
      - task: build

  # ------------------------------------------------------------------
  # Geliştirme (Development) Görevleri
  # ------------------------------------------------------------------
  format:
    desc: "Kodu Spotless ile otomatik formatlar (Google Java Style)"
    dir: '{{.MODULE}}'
    cmds:
      - ./mvnw spotless:apply

  check-format:
    desc: "Kod formatı düzgün mü diye kontrol eder (Değişiklik yapmaz - CI için)"
    dir: '{{.MODULE}}'
    cmds:
      - ./mvnw spotless:check

  build:
    desc: "Projeyi temizler, formatlar, testleri çalıştırır ve paketler"
    dir: '{{.MODULE}}'
    deps: [format] # Önemli: Build'den önce her zaman format atar!
    cmds:
      - ./mvnw clean verify

  run:
    desc: "Uygulamayı localde başlatır (Önce DB'yi kontrol eder)"
    dir: '{{.MODULE}}'
    deps: [infra-up] # Uygulama başlamadan DB'yi ayağa kaldırır
    cmds:
      - ./mvnw spring-boot:run

  # ------------------------------------------------------------------
  # Altyapı (Infrastructure) Görevleri
  # ------------------------------------------------------------------
  infra-up:
    desc: "Docker Compose ile veritabanını ayağa kaldırır"
    cmds:
      - docker-compose -f {{.INFRA_FILE}} up -d
      - echo "Veritabanı başlatılıyor..."

  infra-down:
    desc: "Docker Compose altyapısını durdurur ve siler"
    cmds:
      - docker-compose -f {{.INFRA_FILE}} down

  infra-restart:
    desc: "Altyapıyı kapatır, 5 saniye bekler ve temiz bir şekilde yeniden başlatır"
    cmds:
      - task: infra-down
      - task: sleep
      - task: infra-up

  infra-logs:
    desc: "Konteyner loglarını izler"
    cmds:
      - docker-compose -f {{.INFRA_FILE}} logs -f

  # ------------------------------------------------------------------
  # Yardımcı Görevler (Utility)
  # ------------------------------------------------------------------
  sleep:
    desc: "Belirlenen süre kadar bekler (Varsayılan: 5sn)"
    internal: true # Task listesinde kalabalık yapmasın diye gizledik
    vars:
      DURATION: '{{default 5 .DURATION}}'
    cmds:
      - echo "{{.DURATION}} saniye bekleniyor..."
      - sleep {{.DURATION}}