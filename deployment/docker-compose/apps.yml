name: bookstore-microservices
services:
  catalog-service:
    image: huseyinerkek/catalog-service:${APP_VERSION:-latest}
    container_name: catalog-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_URL=jdbc:postgresql://catalog-db:5432/catalog_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    ports:
      - "8081:8081"
    restart: unless-stopped

    # Ortak ağa katılması şart (DB ile konuşabilmesi için)
    networks:
      - bookstore-network

    # 'depends_on' bloğunu SİLDİK.
    # Çünkü Taskfile.yml'deki 'sleep' komutu ile sıralamayı biz yönetiyoruz.

    deploy:
      resources:
        limits:
          memory: 700m

networks:
  bookstore-network:
    external: true