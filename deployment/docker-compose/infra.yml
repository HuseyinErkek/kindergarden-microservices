version: "3.8"
name: 'bookstore-microservices'

services:
  catalog-db:
    image: postgres:16-alpine
    container_name: catalog-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=catalog_db  # Uygulamanın aradığı isimle aynı olmalı
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookstore-network # <-- EKLEME: Ortak ağ
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 500m

volumes:
  postgres_data:

# Ağı burada oluşturuyoruz
networks:
  bookstore-network:
    name: bookstore-network