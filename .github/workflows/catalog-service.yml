name: Catalog Service

on:
  push:
    paths:
      - 'catalog-service/**'
    branches:
      - '**'  # Her branch'te build alıp test etsin
  pull_request:
    paths:
      - 'catalog-service/**'
    branches:
      - main

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    env:
      working-directory: ./catalog-service
    defaults:
      run:
        working-directory: ${{ env.working-directory }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 1. Adım: Sadece Build ve Test (Her durumda çalışır)
      - name: Build and Test
        run: ./mvnw -ntp clean verify

      # 2. Adım: Docker Hub'a Giriş (Sadece Main branch ise)
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Adım: Imajı Oluştur ve Gönder (Sadece Main branch ise)
      - name: Build and Publish Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          ./mvnw -ntp spring-boot:build-image \
            -DskipTests \
            -Dspring-boot.build-image.publish=true \
            -Ddocker.publishRegistry.username=${{ secrets.DOCKERHUB_USERNAME }} \
            -Ddocker.publishRegistry.password=${{ secrets.DOCKERHUB_TOKEN }}